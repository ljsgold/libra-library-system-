spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/libra_bms?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&connectTimeout=30000&socketTimeout=60000}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root&123}
    druid:
      initial-size: 1
      max-active: 10
      min-idle: 1
      max-wait: 30000
      test-on-borrow: true
      test-while-idle: true
      validation-query: SELECT 1
      connection-timeout: 30000
